{% extends "base.html" %}
{% block title %}Sessions — RemoteOps{% endblock %}
{% block content %}
<div class="card">
  <h2>Interactive Sessions</h2>
  <button class="btn" onclick="load()">Refresh</button>
  <table style="margin-top:1rem">
    <thead><tr><th>Session</th><th>Agent</th><th>Operator</th><th>Status</th><th>Created</th><th></th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
</div>
<script>
function token(){ return localStorage.getItem('access_token') || ''; }
async function load(){
  const r = await fetch('/api/sessions', { headers:{ Authorization:'Bearer '+token() }});
  if(r.status===401){ location.href='/login'; return; }
  const data = await r.json();
  const tb = document.getElementById('rows');
  tb.innerHTML = '';
  data.forEach(s => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td><code>${s.session_id.slice(0,8)}…</code></td><td>${s.agent_id.slice(0,8)}…</td>
      <td>${s.operator}</td><td>${s.status}</td><td>${s.created_at||''}</td>
      <td>${s.status!=='closed'?`<a class="btn" href="/terminal/${s.session_id}">Open</a>`:''}</td>`;
    tb.appendChild(tr);
  });
}
load();
</script>
{% endblock %}

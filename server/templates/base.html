<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>{% block title %}RemoteOps{% endblock %}</title>
  <style>
    :root { --bg:#0f1419; --card:#1a2332; --text:#e7ecf3; --muted:#8b9bb4; --accent:#3b82f6; --danger:#ef4444; --ok:#22c55e; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: ui-sans-serif, system-ui, sans-serif; background:var(--bg); color:var(--text); }
    header { display:flex; align-items:center; gap:1.5rem; padding:0.75rem 1.25rem; background:#0b1017; border-bottom:1px solid #243044; }
    header a { color:var(--muted); text-decoration:none; }
    header a:hover { color:var(--text); }
    .brand { font-weight:700; color:var(--accent); }
    main { padding:1.25rem; max-width:1200px; margin:0 auto; }
    .card { background:var(--card); border:1px solid #243044; border-radius:10px; padding:1rem; margin-bottom:1rem; }
    table { width:100%; border-collapse:collapse; }
    th, td { text-align:left; padding:0.5rem 0.6rem; border-bottom:1px solid #243044; font-size:0.9rem; }
    th { color:var(--muted); font-weight:600; }
    .btn { display:inline-block; background:var(--accent); color:#fff; border:none; border-radius:6px; padding:0.4rem 0.8rem; cursor:pointer; text-decoration:none; font-size:0.85rem; }
    .btn:hover { filter:brightness(1.1); }
    .btn-danger { background:var(--danger); }
    .muted { color:var(--muted); }
    .online { color:var(--ok); }
    .offline { color:var(--danger); }
    input, select { background:#0b1017; border:1px solid #243044; color:var(--text); border-radius:6px; padding:0.45rem 0.6rem; }
    label { display:block; margin:0.5rem 0 0.25rem; color:var(--muted); font-size:0.85rem; }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <header>
    <span class="brand">RemoteOps</span>
    <a href="/">Agents</a>
    <a href="/sessions">Sessions</a>
    <a href="/login">Login</a>
    <a href="/docs" target="_blank">API</a>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>

{% extends "base.html" %}
{% block title %}Agents — RemoteOps{% endblock %}
{% block content %}
<div class="card">
  <h2>Agents</h2>
  <p class="muted">Token required. Login first. Full interactive access via Open Session.</p>
  <button class="btn" onclick="loadAgents()">Refresh</button>
  <table style="margin-top:1rem">
    <thead><tr><th>Hostname</th><th>Agent ID</th><th>IP</th><th>Last Seen</th><th>Actions</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
</div>
<script>
function token(){ return localStorage.getItem('access_token') || ''; }
async function loadAgents(){
  const r = await fetch('/api/agents', { headers:{ Authorization:'Bearer '+token() }});
  if(r.status===401){ location.href='/login'; return; }
  const data = await r.json();
  const tb = document.getElementById('rows');
  tb.innerHTML = '';
  data.forEach(a => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${a.hostname||''}</td><td><code>${a.agent_id}</code></td><td>${a.ip||''}</td><td>${a.last_seen||''}</td>
      <td><button class="btn" onclick="openSession('${a.agent_id}')">Open Session</button></td>`;
    tb.appendChild(tr);
  });
}
async function openSession(agentId){
  const r = await fetch('/api/sessions', {
    method:'POST',
    headers:{ 'Authorization':'Bearer '+token(), 'Content-Type':'application/json' },
    body: JSON.stringify({ agent_id: agentId })
  });
  if(!r.ok){ alert('Failed to create session'); return; }
  const data = await r.json();
  location.href = '/terminal/' + data.session_id;
}
loadAgents();
</script>
{% endblock %}

{% extends "base.html" %}
{% block title %}Login — RemoteOps{% endblock %}
{% block content %}
<div class="card" style="max-width:400px;margin:3rem auto;">
  <h2>Operator Login</h2>
  <form id="loginForm">
    <label>Username</label>
    <input id="username" name="username" required style="width:100%"/>
    <label>Password</label>
    <input id="password" name="password" type="password" required style="width:100%"/>
    <p style="margin-top:1rem"><button class="btn" type="submit">Login</button></p>
    <p id="err" class="muted"></p>
  </form>
</div>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const body = new URLSearchParams();
  body.set('username', document.getElementById('username').value);
  body.set('password', document.getElementById('password').value);
  const r = await fetch('/api/auth/login', { method:'POST', body, headers:{'Content-Type':'application/x-www-form-urlencoded'} });
  if (!r.ok) { document.getElementById('err').textContent = 'Login failed'; return; }
  const data = await r.json();
  localStorage.setItem('access_token', data.access_token);
  localStorage.setItem('role', data.role);
  location.href = '/';
});
</script>
{% endblock %}
